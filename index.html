<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Market</title>
<style>
  body { font-family: sans-serif; background:#f0f0f0; margin:0; padding:0;}
  header { background:#333; color:#fff; padding:1em; text-align:center;}
  .tabs { display:flex; justify-content:center; background:#444; }
  .tab { padding:1em; cursor:pointer; color:#fff; flex:1; text-align:center;}
  .tab.active { background:#666; }
  .panel { display:none; padding:1em; }
  .panel.active { display:block; }
  .card { border:1px solid #888; padding:0.5em; margin:0.5em; display:inline-block; width:80px; text-align:center; cursor:pointer;}
  .selected { border:2px solid red; }
  button { margin:0.2em; }
</style>
</head>
<body>

<header><h1>The Market</h1></header>

<div class="tabs">
  <div class="tab active" data-tab="mine">Mine</div>
  <div class="tab" data-tab="collection">Collection</div>
  <div class="tab" data-tab="trade">Trade</div>
</div>

<div id="mine" class="panel active">
  <h2>Mining</h2>
  <div id="nextCharacter">Waiting...</div>
  <button id="claimBtn">Claim Character</button>
  <div id="mineMsg"></div>
</div>

<div id="collection" class="panel">
  <h2>Your Collection</h2>
  <div id="collectionSlots"></div>
  <button id="discardBtn">Discard Selected</button>
  <div id="collectionMsg"></div>
</div>

<div id="trade" class="panel">
  <h2>Trade</h2>
  <div id="tradePanel">Trading system coming soon...</div>
</div>

<script>
const PLACEHOLDER_CHARACTERS = [
  { id:'c1', name:'Johan', icon:'J', rarity:'Legendary' },
  { id:'c2', name:'Tyler', icon:'T', rarity:'Platinum' },
  { id:'c3', name:'Mark', icon:'M', rarity:'Gold' },
  { id:'c4', name:'Lawrence', icon:'L', rarity:'Silver' },
  { id:'c5', name:'Keegan', icon:'K', rarity:'Bronze' }
];

const rarities = ['Bronze','Silver','Gold','Emerald','Sapphire','Diamond','Platinum','Legendary'];

let nextCharacter = null;
let collection = [null, null, null, null, null, null];
let selectedSlotIndex = null;
let miningInterval = null;

// --- TAB SWITCHING ---
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// --- COLLECTION UI ---
function renderCollection(){
  const container = document.getElementById('collectionSlots');
  container.innerHTML='';
  collection.forEach((card,index)=>{
    const div = document.createElement('div');
    div.className='card'+(selectedSlotIndex===index?' selected':'');
    if(card){
      div.innerHTML=`${card.icon}<br>${card.name}<br>${card.rarity}`;
    }else{
      div.innerHTML='Empty';
    }
    div.addEventListener('click',()=>{ selectedSlotIndex=index; renderCollection(); });
    container.appendChild(div);
  });
}

// --- DISCARD ---
document.getElementById('discardBtn').addEventListener('click',()=>{
  if(selectedSlotIndex===null){ 
    document.getElementById('collectionMsg').innerText='Select a slot to discard';
    return;
  }
  collection[selectedSlotIndex]=null;
  selectedSlotIndex=null;
  renderCollection();
  document.getElementById('collectionMsg').innerText='Card discarded';
});

// --- MINING ---
function randomCharacter(){
  return PLACEHOLDER_CHARACTERS[Math.floor(Math.random()*PLACEHOLDER_CHARACTERS.length)];
}
function updateNextCharacter(){
  nextCharacter = randomCharacter();
  document.getElementById('nextCharacter').innerText=`${nextCharacter.icon} - ${nextCharacter.name} (${nextCharacter.rarity})`;
}
document.getElementById('claimBtn').addEventListener('click',()=>{
  const emptyIndex = collection.findIndex(c=>c===null);
  if(emptyIndex===-1){
    document.getElementById('mineMsg').innerText='No empty slot to claim character';
    return;
  }
  collection[emptyIndex]=nextCharacter;
  renderCollection();
  document.getElementById('mineMsg').innerText=`Claimed ${nextCharacter.name}`;
  updateNextCharacter();
});

// --- INIT ---
renderCollection();
updateNextCharacter();
miningInterval=setInterval(updateNextCharacter,10000);
</script>

</body>
</html>
